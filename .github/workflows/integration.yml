name: Integration (simulator)

# Simulator-in-the-loop tests: list devices, describe, stream live H.264, tap,
# and two-finger pinch against a REAL booted simulator via the native simhelper
# sidecar — on a GitHub-hosted macOS runner (the test script boots a simulator
# itself). Kept non-required: it's the deepest signal but also the slowest
# (~5 min) and most environment-sensitive check; the hosted `test` gate stays
# the merge requirement.
on:
  pull_request:
    paths:
      - 'sidecar/**'
      - 'src/sidecar.ts'
      - 'src/log.ts'
      - 'scripts/integration-sim.js'
      - '.github/workflows/integration.yml'
  push:
    branches: [main]
    paths:
      - 'sidecar/**'
      - 'src/sidecar.ts'
      - 'src/log.ts'
      - 'scripts/integration-sim.js'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

# Each hosted VM has its own isolated simulator set, so runs don't contend —
# just cancel superseded runs on the same ref to save minutes.
concurrency:
  group: simulator-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install idb frameworks
        run: |
          brew tap facebook/fb
          brew trust --tap facebook/fb
          brew install idb-companion

      - name: Install node deps
        run: npm ci

      - name: Compile extension code
        run: npm run compile

      - name: Build sidecar (debug)
        working-directory: sidecar
        run: swift build

      - name: Simulator integration test
        env:
          # Cold CI VMs need far larger budgets than a warm local Mac: the
          # first CoreSimulatorService contact, the first RPC, and the initial
          # simulator boot (~60s of "data migration") all run long.
          VSCODESIM_READY_TIMEOUT_MS: "120000"
          VSCODESIM_CALL_TIMEOUT_MS: "90000"
          VSCODESIM_TEST_WATCHDOG_MS: "300000"
          # Cold VMs can take a long time to deliver the first video frame.
          VSCODESIM_TEST_FIRSTFRAME_MS: "90000"
        run: npm run test:integration
