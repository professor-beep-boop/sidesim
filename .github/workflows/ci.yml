name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      # VS Code needs a display; xvfb provides one on headless Linux runners.
      # Simulator/idb-dependent behavior is not exercised here — those paths
      # require a macOS host with a booted simulator.
      - name: Test
        run: xvfb-run -a npm test
